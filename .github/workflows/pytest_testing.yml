name: Pytest testing

on:
  push:
    branches:    
      - 'main'
      - 'dev'
  pull_request:
    branches:
      - 'main'
      - 'dev'

jobs:
  test:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }} and NumPy ${{ matrix.numpy-version }}
    runs-on: ${{ matrix.os }}
    env:
      # MultiNest 3.12 commit (the same one pinned in container/poseidon.def)
      MULTINEST_COMMIT: cc616c17ed440fbff8d35937997c86256ed4d744
    strategy:
      # Let every job finish, so one failure does not hide the others
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12']
        numpy-version: ['<2', '>=2']
    steps:
    - uses: actions/checkout@v4

    - name: Free disk space
      if: runner.os == 'Linux'
      run: |
        sudo swapoff -a
        sudo rm -f /swapfile
        sudo apt clean
        docker rmi $(docker image ls -aq)
        df -h

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    # As in container/poseidon.def: one system MPI (Open MPI), against which
    # MultiNest and mpi4py are both built
    - name: Install Open MPI and build tools (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y gfortran cmake libopenmpi-dev openmpi-bin \
                                liblapack-dev libblas-dev

    # Homebrew's open-mpi brings gfortran (via gcc); LAPACK comes from Apple's
    # Accelerate framework
    - name: Install Open MPI and build tools (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install open-mpi cmake wget

        # Open MPI's session files are Unix sockets, whose paths can be too
        # long under macOS's default TMPDIR (/var/folders/...)
        echo "TMPDIR=/tmp" >> $GITHUB_ENV

    - name: Build MultiNest 3.12
      run: |
        git clone https://github.com/farhanferoz/MultiNest.git $RUNNER_TEMP/MultiNest
        cd $RUNNER_TEMP/MultiNest
        git checkout $MULTINEST_COMMIT
        cd MultiNest_v3.12_CMake/multinest
        mkdir -p build
        cd build

        # CMAKE_POLICY_VERSION_MINIMUM lets newer CMake versions accept
        # MultiNest's old cmake_minimum_required(VERSION 2.8)
        FC=mpifort CC=mpicc CXX=mpicxx \
        cmake -DCMAKE_INSTALL_PREFIX=$HOME/multinest \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              ..

        # MultiNest's library variants share Fortran .mod files, so parallel
        # make has a race condition - build single-threaded. Only the serial
        # and MPI shared libraries are needed (not the bundled examples).
        make -j1 multinest_shared multinest_mpi_shared

        if [[ "$RUNNER_OS" == "macOS" ]]; then

          # macOS strips DYLD_LIBRARY_PATH from child processes of system
          # shells, so put the libraries in ~/lib, which is on the default
          # library search path (used by PyMultiNest's find_library)
          mkdir -p $HOME/lib
          cp -P ../lib/libmultinest*.dylib $HOME/lib/
          test -f $HOME/lib/libmultinest.dylib
          test -f $HOME/lib/libmultinest_mpi.dylib

        else
          mkdir -p $HOME/multinest/lib
          cp -P ../lib/libmultinest*.so* $HOME/multinest/lib/

          # Check both the serial and MPI shared libraries were built
          test -f $HOME/multinest/lib/libmultinest.so
          test -f $HOME/multinest/lib/libmultinest_mpi.so

          echo "LD_LIBRARY_PATH=$HOME/multinest/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
        fi

    - name: Install mpi4py and POSEIDON
      run: |
        python -m pip install --upgrade pip

        # Build mpi4py from source against the system Open MPI
        MPICC=mpicc python -m pip install --no-binary=mpi4py mpi4py

        # PyMultiNest (pure Python) is installed from PyPI via setup.py
        python -m pip install -e . "numpy${{ matrix.numpy-version }}"
        python -c "import numpy; print('NumPy version: ' + numpy.__version__)"

    - name: Check MPI, MultiNest, and POSEIDON imports
      run: |
        if [[ "$RUNNER_OS" == "macOS" ]]; then sw_vers; else cat /etc/os-release; fi
        python - << 'EOF'
        import sys
        import ctypes
        import ctypes.util
        from mpi4py import MPI

        print('MPI library: ' + MPI.Get_library_version().splitlines()[0])

        # Both MultiNest libraries must be loadable (PyMultiNest picks the MPI
        # one when running on more than one MPI rank). On macOS, find them the
        # same way PyMultiNest does.
        for lib in ['multinest', 'multinest_mpi']:
            if (sys.platform == 'darwin'):
                lib_path = ctypes.util.find_library(lib)
                if (lib_path is None):
                    raise Exception("Error: lib" + lib + ".dylib not found.")
            else:
                lib_path = 'lib' + lib + '.so'
            ctypes.CDLL(lib_path)
            print('Loaded ' + lib_path)

        print('MultiNest libraries: OK')

        import pymultinest
        import POSEIDON.core
        print('PyMultiNest and POSEIDON imports: OK')
        EOF

    - name: Download input files (only CIA opacity for CI tests)
      if: steps.restore_cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p inputs/opacity
        mkdir -p inputs/chemistry_grids
        wget --wait=1 --random-wait --continue --load-cookies /tmp/cookies.txt "https://docs.google.com/uc?export=download&confirm=$(wget --quiet --save-cookies /tmp/cookies.txt --keep-session-cookies --no-check-certificate 'https://docs.google.com/uc?export=download&id=1VxIhlVwOelix4BOZxa7oieV5hbP4Q8Bx' -O- | LC_ALL=C sed -En 's/.*confirm=([0-9A-Za-z_]+).*/\1/p')&id=1VxIhlVwOelix4BOZxa7oieV5hbP4Q8Bx" -O inputs/opacity/Opacity_database_cia.hdf5 && rm -rf /tmp/cookies.txt
        wget --wait=1 --random-wait --continue --load-cookies /tmp/cookies.txt "https://docs.google.com/uc?export=download&confirm=$(wget --quiet --save-cookies /tmp/cookies.txt --keep-session-cookies --no-check-certificate 'https://docs.google.com/uc?export=download&id=1ar1u7yMnMvWAp6bLc2kENg2b4khxdww3' -O- | LC_ALL=C sed -En 's/.*confirm=([0-9A-Za-z_]+).*/\1/p')&id=1ar1u7yMnMvWAp6bLc2kENg2b4khxdww3" -O inputs/chemistry_grids/fastchem_database.hdf5 && rm -rf /tmp/cookies.txt

    - name: Set environment variables
      run: |
        echo "POSEIDON_input_data=$GITHUB_WORKSPACE/inputs/" >> $GITHUB_ENV
        echo "PYSYN_CDBS=$GITHUB_WORKSPACE/inputs/stellar_grids/" >> $GITHUB_ENV

    - name: Run tests
      run: |
        pytest -rA
